image: node:24-alpine

stages:
  - check
  - package
  - release

variables:
  PACKAGE_REGISTRY_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/packwise-vscode

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

before_script:
  - npm ci --cache .npm --prefer-offline

check:
  stage: check
  script:
    # The discovery tests drive git (check-ignore), absent from the alpine image.
    - apk add --no-cache git
    - npm run typecheck
    - npm test

package:
  stage: package
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION=$(node -p "require('./package.json').version")
        if [ "v$VERSION" != "$CI_COMMIT_TAG" ]; then
          echo "Tag $CI_COMMIT_TAG does not match package.json version $VERSION" >&2
          exit 1
        fi
      fi
    - echo "VERSION=$(node -p "require('./package.json').version")" > version.env
    - npm run package
  artifacts:
    name: packwise-vscode-$CI_COMMIT_SHORT_SHA
    paths: ['*.vsix']
    reports:
      dotenv: version.env
    expire_in: 90 days

# Tag pipelines (vX.Y.Z): store the .vsix in the generic package registry
# (no expiry) and create a GitLab release linking to it.
publish:
  stage: release
  image: curlimages/curl:8.11.1
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: [package]
  cache: []
  before_script: []
  script:
    - >
      curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file "packwise-$VERSION.vsix"
      "$PACKAGE_REGISTRY_URL/$VERSION/packwise-$VERSION.vsix"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: [package, publish]
  cache: []
  before_script: []
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Packwise $CI_COMMIT_TAG
    description: Packwise VS Code extension $CI_COMMIT_TAG
    assets:
      links:
        - name: packwise-${VERSION}.vsix
          url: ${PACKAGE_REGISTRY_URL}/${VERSION}/packwise-${VERSION}.vsix
          link_type: package

# Same release on the public GitHub mirror (the push mirror copies tags, not releases). Needs a GITHUB_TOKEN CI/CD
# variable: fine-grained token on tinou0902/packwise with "Contents: read and write".
# Backfill: run a pipeline on main (UI or API) with GITHUB_RELEASE_TAG=vX.Y.Z (the .vsix comes from the package registry).
github-release:
  stage: release
  rules:
    - if: $GITHUB_TOKEN == null || $GITHUB_TOKEN == ""
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      variables: { RELEASE_TAG: $CI_COMMIT_TAG }
      needs: [package, release]
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $GITHUB_RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/
      variables: { RELEASE_TAG: $GITHUB_RELEASE_TAG }
      needs: []
  cache: []
  before_script: []
  script:
    - VSIX="packwise-${RELEASE_TAG#v}.vsix"
    - |
      if [ ! -f "$VSIX" ]; then
        wget -q --header "JOB-TOKEN: $CI_JOB_TOKEN" -O "$VSIX" "$PACKAGE_REGISTRY_URL/${RELEASE_TAG#v}/$VSIX"
      fi
    - node scripts/github-release.mjs "$RELEASE_TAG" "$VSIX"

# Publish to the VS Code Marketplace (publisher tinou0902). Needs a masked VSCE_PAT CI/CD variable: Azure DevOps
# PAT, organization "All accessible organizations", scope "Marketplace: Manage".
# Backfill: run a pipeline on main (UI or API) with MARKETPLACE_TAG=vX.Y.Z (the .vsix comes from the package registry).
marketplace:
  stage: release
  rules:
    - if: $VSCE_PAT == null || $VSCE_PAT == ""
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      variables: { RELEASE_TAG: $CI_COMMIT_TAG }
      needs: [package, release]
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $MARKETPLACE_TAG =~ /^v\d+\.\d+\.\d+$/
      variables: { RELEASE_TAG: $MARKETPLACE_TAG }
      needs: []
  cache: []
  script:
    - VSIX="packwise-${RELEASE_TAG#v}.vsix"
    - |
      if [ ! -f "$VSIX" ]; then
        wget -q --header "JOB-TOKEN: $CI_JOB_TOKEN" -O "$VSIX" "$PACKAGE_REGISTRY_URL/${RELEASE_TAG#v}/$VSIX"
      fi
    # vsce reads the token from VSCE_PAT.
    - npx vsce publish --packagePath "$VSIX"
